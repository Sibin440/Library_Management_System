services:
  - type: web
    name: opac-app
    runtime: java
    buildCommand: cd javaproject/opac && mvn clean package -DskipTests
    startCommand: java -jar javaproject/opac/target/opac-0.0.1-SNAPSHOT.jar
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: opac-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: opac-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: opac-db
          property: password
      - key: PORT
        value: 8081
    healthCheckPath: /actuator/health

databases:
  - name: opac-db
    databaseName: opac_db
    user: opac_user
    plan: free
