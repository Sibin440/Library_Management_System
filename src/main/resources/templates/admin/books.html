<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System – Admin Catalog</title>
    <style>
        :root {
            --bg-color: #f5f5f5;
            --text-color: #333333;
            --card-bg: #ffffff;
            --card-border: #e0e0e0;
            --input-bg: #ffffff;
            --input-border: #ddd;
            --input-text: #333333;
            --table-header: #f2f2f2;
            --table-border: #dddddd;
            --table-row-hover: #f5f5f5;
            --header-bg: #2c3e50;
        }

        body.dark-mode {
            --bg-color: #0f0c29;
            --text-color: #f3f4f6;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.12);
            --input-bg: rgba(255, 255, 255, 0.07);
            --input-border: rgba(255, 255, 255, 0.12);
            --input-text: #ffffff;
            --table-header: rgba(255, 255, 255, 0.08);
            --table-border: rgba(255, 255, 255, 0.05);
            --table-row-hover: rgba(255, 255, 255, 0.02);
            --header-bg: #1a1a2e;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-attachment: fixed;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background-color: var(--header-bg);
            color: white;
            padding: 20px 0;
            text-align: center;
            transition: background-color 0.3s;
        }
        
        header h1 {
            margin: 0;
        }
        
        .search-bar {
            display: flex;
            margin: 20px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .search-bar input {
            flex: 1;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--input-text);
            border-right: none;
            border-radius: 4px 0 0 4px;
            font-size: 16px;
            transition: all 0.2s;
        }
        
        .search-bar button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 16px;
        }
        
        .search-bar button:hover {
            background-color: #2980b9;
        }
        
        .main-content {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        
        .book-form {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }
        
        .book-form h2 {
            margin-top: 0;
            color: var(--text-color);
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--input-text);
            border-radius: 4px;
            font-size: 16px;
            transition: all 0.2s;
        }
        
        .form-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        
        .btn-primary {
            background-color: #2ecc71;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #27ae60;
        }
        
        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #7f8c8d;
        }
        
        .books-list {
            flex: 2;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }
        
        .books-list h2 {
            margin-top: 0;
            color: var(--text-color);
        }
        
        .book-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .book-table th, .book-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--table-border);
        }
        
        .book-table th {
            background-color: var(--table-header);
            font-weight: 600;
        }
        
        .book-table tr:hover {
            background-color: var(--table-row-hover);
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        
        .btn-edit {
            background-color: #3498db;
            color: white;
        }
        
        .btn-edit:hover {
            background-color: #2980b9;
        }
        
        .btn-delete {
            background-color: #e74c3c;
            color: white;
        }
        
        .btn-delete:hover {
            background-color: #c0392b;
        }
        
        .notification {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            display: none;
        }
        
        .notification.success {
            background-color: #d5f5e3;
            color: #27ae60;
            border-left: 4px solid #27ae60;
        }
        
        .notification.error {
            background-color: #fadbd8;
            color: #e74c3c;
            border-left: 4px solid #e74c3c;
        }
        
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .book-form, .books-list {
                flex: none;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
            <h1>Library Management System (Admin)</h1>
            <div style="display: flex; gap: 12px; align-items: center;">
                <a th:href="@{/admin/dashboard}" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 20px; padding: 6px 16px; text-decoration: none; font-size: 14px; font-weight: 500; transition: background 0.2s;">Admin Dashboard</a>
                <button id="theme-toggle" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 20px; padding: 6px 16px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 6px; font-family: inherit; font-weight: 500; outline: none; transition: background 0.2s;">
                    <span id="theme-icon">🌙</span> <span id="theme-text">Dark Mode</span>
                </button>
                <form th:action="@{/logout}" method="post" style="display:inline; margin: 0;">
                    <button type="submit" style="background: #e74c3c; border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 20px; padding: 6px 16px; cursor: pointer; font-size: 14px; font-weight: 500; font-family: inherit; outline: none; transition: background 0.2s;">Logout ↗</button>
                </form>
            </div>
        </div>
    </header>
    
    <div class="container">
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search by title or author...">
            <button id="search-button">Search</button>
        </div>
        
        <div id="notification" class="notification"></div>
        
        <!-- Existing Book CRUD Section -->
        <div class="main-content">
            <div class="book-form">
                <h2 id="form-title">Add New Book</h2>
                <form id="book-form">
                    <input type="hidden" id="book-id">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="author">Author</label>
                        <input type="text" id="author" name="author" required>
                    </div>
                    <div class="form-group">
                        <label for="isbn">ISBN</label>
                        <input type="text" id="isbn" name="isbn" required>
                    </div>
                    <div class="form-actions">
                        <button type="button" id="reset-button" class="btn btn-secondary">Reset</button>
                        <button type="submit" id="submit-button" class="btn btn-primary">Add Book</button>
                    </div>
                </form>
            </div>
            
            <div class="books-list">
                <h2>Books Collection</h2>
                <div class="loader" id="loader"></div>
                <table class="book-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Author</th>
                            <th>ISBN</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="books-table-body">
                        <!-- Book data will be inserted here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- NEW: Loans Monitoring and Alerts Section -->
        <div class="main-content" style="margin-top: 40px; border-top: 2px solid var(--card-border); padding-top: 30px;">
            <!-- Send Alert Panel -->
            <div class="book-form" style="flex: 1;">
                <h2>Send Alert to User</h2>
                <form id="alert-form" style="margin-top: 15px;">
                    <div class="form-group">
                        <label for="alert-user-select">Select User</label>
                        <select id="alert-user-select" required style="width: 100%; padding: 10px; background-color: var(--input-bg); border: 1px solid var(--input-border); color: var(--input-text); border-radius: 4px; font-size: 16px; font-family: inherit; outline: none; transition: all 0.2s;">
                            <option value="">-- Choose User --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="alert-message">Alert Message</label>
                        <textarea id="alert-message" required placeholder="Enter alert message (e.g. Please return Gatsby)" style="width: 100%; height: 100px; padding: 10px; background-color: var(--input-bg); border: 1px solid var(--input-border); color: var(--input-text); border-radius: 4px; font-size: 16px; font-family: inherit; resize: vertical; outline: none; transition: all 0.2s; box-sizing: border-box;"></textarea>
                    </div>
                    <div class="form-actions" style="margin-top: 15px;">
                        <button type="submit" style="background-color: #e67e22; color: white;" class="btn">Send Alert</button>
                    </div>
                </form>
            </div>
            
            <!-- Loan Monitor Table -->
            <div class="books-list" style="flex: 2;">
                <h2>Loan Monitoring & Fines</h2>
                <div class="loader" id="loans-loader" style="display: none;"></div>
                <table class="book-table">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Book Title</th>
                            <th>Borrow Date</th>
                            <th>Due Date</th>
                            <th>Returned Date</th>
                            <th>Status</th>
                            <th>Fine</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="loans-table-body">
                        <!-- Loan monitor data will be inserted here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        // Theme toggle functionality
        const toggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');
        const currentTheme = localStorage.getItem('theme');

        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeIcon.textContent = '☀️';
            themeText.textContent = 'Light Mode';
        }

        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            let theme = 'light';
            if (document.body.classList.contains('dark-mode')) {
                theme = 'dark';
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light Mode';
            } else {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark Mode';
            }
            localStorage.setItem('theme', theme);
        });

        // API Base URLs
        const API_BASE_URL = '/api/books';
        const LOANS_API_URL = '/api/loans';
        const ALERTS_API_URL = '/api/alerts';
        
        // DOM Elements
        const bookForm = document.getElementById('book-form');
        const bookIdInput = document.getElementById('book-id');
        const titleInput = document.getElementById('title');
        const authorInput = document.getElementById('author');
        const isbnInput = document.getElementById('isbn');
        const resetButton = document.getElementById('reset-button');
        const submitButton = document.getElementById('submit-button');
        const formTitle = document.getElementById('form-title');
        const booksTableBody = document.getElementById('books-table-body');
        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        const notification = document.getElementById('notification');
        const loader = document.getElementById('loader');

        // New Loan/Alert DOM Elements
        const loansTableBody = document.getElementById('loans-table-body');
        const loansLoader = document.getElementById('loans-loader');
        const alertForm = document.getElementById('alert-form');
        const alertUserSelect = document.getElementById('alert-user-select');
        const alertMessage = document.getElementById('alert-message');
        
        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            loadBooks();
            loadLoans();
            loadUsersForAlerts();
        });
        bookForm.addEventListener('submit', handleFormSubmit);
        resetButton.addEventListener('click', resetForm);
        searchButton.addEventListener('click', handleSearch);
        searchInput.addEventListener('keyup', function(event) {
            if (event.key === 'Enter') {
                handleSearch();
            }
        });
        alertForm.addEventListener('submit', handleAlertSubmit);
        
        // Show loader
        function showLoader() {
            loader.style.display = 'block';
        }
        
        // Hide loader
        function hideLoader() {
            loader.style.display = 'none';
        }
        
        // Show notification
        function showNotification(message, type) {
            notification.textContent = message;
            notification.className = 'notification ' + type;
            notification.style.display = 'block';
            
            // Auto hide after 3 seconds
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
        
        // Load all books
        async function loadBooks() {
            try {
                showLoader();
                const response = await fetch(API_BASE_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const books = await response.json();
                displayBooks(books);
            } catch (error) {
                showNotification('Failed to load books: ' + error.message, 'error');
                console.error('Error loading books:', error);
            } finally {
                hideLoader();
            }
        }
        
        // Display books in the table
        function displayBooks(books) {
            booksTableBody.innerHTML = '';
            
            if (books.length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td colspan="4" style="text-align: center;">No books found</td>
                `;
                booksTableBody.appendChild(row);
                return;
            }
            
            books.forEach(book => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${book.title}</td>
                    <td>${book.author}</td>
                    <td>${book.isbn}</td>
                    <td class="action-buttons">
                        <button class="btn btn-edit" data-id="${book.id}">Edit</button>
                        <button class="btn btn-delete" data-id="${book.id}">Delete</button>
                    </td>
                `;
                booksTableBody.appendChild(row);
                
                // Add event listeners to buttons
                row.querySelector('.btn-edit').addEventListener('click', () => editBook(book));
                row.querySelector('.btn-delete').addEventListener('click', () => deleteBook(book.id));
            });
        }
        
        // Handle form submission (Add/Update book)
        async function handleFormSubmit(event) {
            event.preventDefault();
            
            const bookData = {
                title: titleInput.value,
                author: authorInput.value,
                isbn: isbnInput.value
            };
            
            const bookId = bookIdInput.value;
            let url = API_BASE_URL;
            let method = 'POST';
            
            // If bookId exists, it's an update operation
            if (bookId) {
                url = `${API_BASE_URL}/${bookId}`;
                method = 'PUT';
                bookData.id = bookId;
            }
            
            try {
                showLoader();
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bookData)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                
                const savedBook = await response.json();
                showNotification(
                    `Book "${savedBook.title}" has been ${bookId ? 'updated' : 'added'} successfully!`, 
                    'success'
                );
                
                resetForm();
                loadBooks();
            } catch (error) {
                showNotification(`Failed to ${bookId ? 'update' : 'add'} book: ` + error.message, 'error');
                console.error(`Error ${bookId ? 'updating' : 'adding'} book:`, error);
            } finally {
                hideLoader();
            }
        }
        
        // Edit book - populate form with book data
        function editBook(book) {
            bookIdInput.value = book.id;
            titleInput.value = book.title;
            authorInput.value = book.author;
            isbnInput.value = book.isbn;
            formTitle.textContent = 'Edit Book';
            submitButton.textContent = 'Update Book';
            
            // Scroll to form
            bookForm.scrollIntoView({ behavior: 'smooth' });
        }
        
        // Delete book
        async function deleteBook(id) {
            if (!confirm('Are you sure you want to delete this book?')) {
                return;
            }
            
            try {
                showLoader();
                const response = await fetch(`${API_BASE_URL}/${id}`, {
                    method: 'DELETE'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                
                showNotification('Book has been deleted successfully!', 'success');
                loadBooks();
            } catch (error) {
                showNotification('Failed to delete book: ' + error.message, 'error');
                console.error('Error deleting book:', error);
            } finally {
                hideLoader();
            }
        }
        
        // Handle search
        async function handleSearch() {
            const query = searchInput.value.trim();
            if (!query) {
                loadBooks();
                return;
            }
            
            try {
                showLoader();
                const response = await fetch(`${API_BASE_URL}/search?query=${encodeURIComponent(query)}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                
                const books = await response.json();
                displayBooks(books);
            } catch (error) {
                showNotification('Search failed: ' + error.message, 'error');
                console.error('Error searching books:', error);
            } finally {
                hideLoader();
            }
        }
        
        // Reset form
        function resetForm() {
            bookForm.reset();
            bookIdInput.value = '';
            formTitle.textContent = 'Add New Book';
            submitButton.textContent = 'Add Book';
        }

        // NEW: Load all system loans for Admin monitoring
        async function loadLoans() {
            try {
                loansLoader.style.display = 'block';
                const response = await fetch(`${LOANS_API_URL}/all`);
                if (!response.ok) throw new Error();
                const loans = await response.json();
                displayLoans(loans);
            } catch (error) {
                console.error('Error loading admin loans monitoring');
            } finally {
                loansLoader.style.display = 'none';
            }
        }

        // Display Loans in admin table
        function displayLoans(loans) {
            loansTableBody.innerHTML = '';
            if (loans.length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = `<td colspan="8" style="text-align: center;">No borrow/loan records in system</td>`;
                loansTableBody.appendChild(row);
                return;
            }

            loans.forEach(loan => {
                const borrowDateStr = new Date(loan.loanDate).toLocaleDateString();
                const dueDateStr = new Date(loan.dueDate).toLocaleDateString();
                const returnedDateStr = loan.returnedDate ? new Date(loan.returnedDate).toLocaleDateString() : '-';
                
                const isOverdue = loan.fine > 0;
                const statusColor = loan.status === 'RETURNED' ? '#2ecc71' : 
                                    loan.status === 'RETURN_REQUESTED' ? '#e67e22' : 
                                    (isOverdue ? '#e74c3c' : '#f39c12');
                const statusLabel = loan.status === 'RETURN_REQUESTED' ? 'PENDING RETURN' : loan.status;
                const fineDisplay = loan.fine > 0 ? `₹${loan.fine}` : '₹0';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${loan.user.username}</strong></td>
                    <td>${loan.book.title}</td>
                    <td>${borrowDateStr}</td>
                    <td>${dueDateStr}</td>
                    <td>${returnedDateStr}</td>
                    <td style="color: ${statusColor}; font-weight: 600;">${statusLabel}</td>
                    <td style="color: ${isOverdue ? '#e74c3c' : 'inherit'}; font-weight: ${isOverdue ? '600' : 'normal'};">${fineDisplay}</td>
                    <td>
                        ${loan.status === 'RETURN_REQUESTED' ? 
                          `<button class="btn btn-success btn-approve-return" data-id="${loan.id}" style="background-color: #2ecc71; color: white; border: none; padding: 4px 10px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 13px;">Approve</button>` : 
                          '-'}
                    </td>
                `;
                loansTableBody.appendChild(row);

                if (loan.status === 'RETURN_REQUESTED') {
                    row.querySelector('.btn-approve-return').addEventListener('click', () => approveReturn(loan.id, loan.book.title, loan.user.username));
                }
            });
        }

        // Approve Return Request
        async function approveReturn(loanId, bookTitle, username) {
            try {
                showLoader();
                const response = await fetch(`${LOANS_API_URL}/approve/${loanId}`, {
                    method: 'POST'
                });
                if (!response.ok) {
                    throw new Error(`Failed to approve return. Status: ${response.status}`);
                }
                showNotification(`Successfully approved return of "${bookTitle}" from user "${username}"!`, 'success');
                loadLoans();
            } catch (error) {
                showNotification(error.message, 'error');
            } finally {
                hideLoader();
            }
        }

        // NEW: Load users for the alert compose dropdown
        async function loadUsersForAlerts() {
            try {
                const response = await fetch(`${ALERTS_API_URL}/users`);
                if (!response.ok) throw new Error();
                const users = await response.json();
                
                // Populate select option
                alertUserSelect.innerHTML = '<option value="">-- Choose User --</option>';
                users.forEach(user => {
                    const option = document.createElement('option');
                    option.value = user.id;
                    option.textContent = `${user.username} (${user.email})`;
                    alertUserSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading users for alerts selection');
            }
        }

        // NEW: Send alert notification to user
        async function handleAlertSubmit(event) {
            event.preventDefault();
            const userId = alertUserSelect.value;
            const message = alertMessage.value.trim();

            if (!userId || !message) return;

            try {
                const response = await fetch(`${ALERTS_API_URL}/send`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ userId: parseInt(userId), message: message })
                });

                if (!response.ok) throw new Error();
                
                showNotification('Alert message sent successfully!', 'success');
                alertForm.reset();
            } catch (error) {
                showNotification('Failed to send alert.', 'error');
            }
        }
    </script>
</body>
</html>
