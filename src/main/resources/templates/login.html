<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login – OPAC Library System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            position: relative;
            overflow: hidden;
        }

        /* Animated blobs */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 8s ease-in-out infinite;
        }
        body::before {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #7c3aed, #4f46e5);
            top: -100px; left: -100px;
        }
        body::after {
            width: 350px; height: 350px;
            background: radial-gradient(circle, #ec4899, #8b5cf6);
            bottom: -80px; right: -80px;
            animation-delay: -4s;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(30px) scale(1.05); }
        }

        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            padding: 48px 44px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }
        .logo-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            box-shadow: 0 8px 20px rgba(124,58,237,0.4);
        }
        .logo-text { color: #fff; }
        .logo-text h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
        .logo-text p  { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 1px; }

        .heading { margin-bottom: 28px; }
        .heading h2 { font-size: 26px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
        .heading p  { font-size: 14px; color: rgba(255,255,255,0.5); margin-top: 4px; }

        .alert {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.35);
            border-radius: 10px;
            padding: 12px 16px;
            color: #fca5a5;
            font-size: 13.5px;
            margin-bottom: 20px;
            display: flex; align-items: center; gap: 8px;
        }
        .alert-success {
            background: rgba(34,197,94,0.15);
            border-color: rgba(34,197,94,0.35);
            color: #86efac;
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.7); margin-bottom: 8px; }

        .input-wrap { position: relative; }
        .input-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            font-size: 16px; opacity: 0.5; pointer-events: none;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 13px 16px 13px 42px;
            color: #fff;
            font-size: 14.5px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }
        input::placeholder { color: rgba(255,255,255,0.25); }
        input:focus {
            border-color: #7c3aed;
            background: rgba(124,58,237,0.08);
            box-shadow: 0 0 0 3px rgba(124,58,237,0.2);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            color: #fff;
            margin-top: 8px;
            letter-spacing: 0.2px;
            box-shadow: 0 8px 24px rgba(124,58,237,0.35);
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(124,58,237,0.45); }
        .btn:hover::after { opacity: 1; }
        .btn:active { transform: translateY(0); }

        .divider {
            display: flex; align-items: center; gap: 12px;
            margin: 24px 0;
            color: rgba(255,255,255,0.25);
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1;
            height: 1px; background: rgba(255,255,255,0.1);
        }

        .footer-text {
            text-align: center;
            font-size: 13.5px;
            color: rgba(255,255,255,0.45);
            margin-top: 4px;
        }
        .footer-text a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .footer-text a:hover { color: #c4b5fd; }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(124,58,237,0.2);
            border: 1px solid rgba(124,58,237,0.3);
            border-radius: 99px;
            padding: 4px 12px;
            font-size: 11.5px;
            color: #c4b5fd;
            margin-bottom: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <div class="logo-icon">📚</div>
        <div class="logo-text">
            <h1>OPAC</h1>
            <p>Library Management System</p>
        </div>
    </div>

    <div class="badge">🔐 Secure Access Portal</div>

    <div class="heading">
        <h2>Welcome back</h2>
        <p>Sign in to access your library dashboard</p>
    </div>

    <!-- Error message -->
    <div th:if="${param.error}" class="alert">
        ⚠️ Invalid username or password. Please try again.
    </div>

    <!-- Logout message -->
    <div th:if="${param.logout}" class="alert alert-success">
        ✅ You've been logged out successfully.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <div class="input-wrap">
                <span class="input-icon">👤</span>
                <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required/>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrap">
                <span class="input-icon">🔑</span>
                <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required/>
            </div>
        </div>

        <button type="submit" class="btn">Sign In →</button>
    </form>

    <div class="divider">or</div>

    <p class="footer-text">
        Don't have an account? <a th:href="@{/signup}">Create one free →</a>
    </p>
</div>
</body>
</html>
