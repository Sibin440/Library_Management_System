<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login – OPAC Library System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-color: #f5f5f5;
            --text-color: #333333;
            --card-bg: #ffffff;
            --card-border: #e0e0e0;
            --card-shadow: rgba(0, 0, 0, 0.05);
            --heading-color: #2c3e50;
            --text-secondary: #7f8c8d;
            --input-bg: #ffffff;
            --input-border: #d1d5db;
            --input-text: #111827;
            --badge-bg: #f3f4f6;
            --badge-border: #e5e7eb;
            --badge-text: #4b5563;
            --divider-color: #e5e7eb;
        }

        body.dark-mode {
            --bg-color: #0f0c29;
            --text-color: #f3f4f6;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.12);
            --card-shadow: rgba(0, 0, 0, 0.4);
            --heading-color: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --input-bg: rgba(255, 255, 255, 0.07);
            --input-border: rgba(255, 255, 255, 0.12);
            --input-text: #ffffff;
            --badge-bg: rgba(124, 58, 237, 0.2);
            --badge-border: rgba(124, 58, 237, 0.3);
            --badge-text: #c4b5fd;
            --divider-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-color);
            background-image: linear-gradient(135deg, var(--bg-color), var(--bg-color));
            color: var(--text-color);
            position: relative;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-mode {
            background-image: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        }

        /* Top Theme Toggle Switch */
        .theme-toggle-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            font-size: 18px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 20px;
            box-shadow: 0 4px 6px var(--card-shadow);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        .theme-toggle-btn:hover {
            transform: scale(1.05);
            background: var(--divider-color);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px var(--card-shadow);
            animation: fadeIn 0.4s ease-out;
            position: relative;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .logo-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            color: #fff;
        }
        .logo-text h1 { font-size: 18px; font-weight: 700; color: var(--heading-color); }
        .logo-text p  { font-size: 11px; color: var(--text-secondary); }

        .heading { margin-bottom: 24px; }
        .heading h2 { font-size: 22px; font-weight: 700; color: var(--heading-color); }
        .heading p  { font-size: 13.5px; color: var(--text-secondary); margin-top: 4px; }

        .alert {
            background: #fdf2f2;
            border: 1px solid #fbd5d5;
            border-radius: 8px;
            padding: 12px 14px;
            color: #c81e1e;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .alert-success {
            background: #edfdfd;
            border-color: #c5f2f2;
            color: #0369a1;
        }
        .close-alert-btn {
            background: transparent;
            border: none;
            color: inherit;
            font-size: 18px;
            cursor: pointer;
            font-weight: 700;
            line-height: 1;
            padding: 0 4px;
        }

        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; color: var(--text-color); margin-bottom: 6px; opacity: 0.85; }

        .input-wrap { position: relative; }
        .input-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            font-size: 15px; opacity: 0.5; pointer-events: none;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            padding: 12px 14px 12px 38px;
            color: var(--input-text);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.15s;
        }
        input::placeholder { color: var(--text-secondary); opacity: 0.6; }
        input:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            background-color: #3498db;
            color: #fff;
            margin-top: 8px;
            transition: background-color 0.15s, transform 0.1s;
        }
        .btn:hover { background-color: #2980b9; }
        .btn:active { transform: translateY(1px); }

        .divider {
            display: flex; align-items: center; gap: 12px;
            margin: 20px 0;
            color: var(--text-secondary);
            font-size: 12px;
            opacity: 0.7;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1;
            height: 1px; background: var(--divider-color);
        }

        .footer-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .footer-text a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.15s;
        }
        .footer-text a:hover { color: #2980b9; }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--badge-bg);
            border: 1px solid var(--badge-border);
            border-radius: 99px;
            padding: 4px 10px;
            font-size: 11px;
            color: var(--badge-text);
            margin-bottom: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>
<!-- Theme toggle button top right of page -->
<button id="theme-toggle" class="theme-toggle-btn">
    <span id="theme-icon">🌙</span> <span id="theme-text">Dark Mode</span>
</button>

<div class="card">
    <div class="logo">
        <div class="logo-icon">📚</div>
        <div class="logo-text">
            <h1>OPAC</h1>
            <p>Library Management System</p>
        </div>
    </div>

    <div class="badge">🔐 Secure Access Portal</div>

    <div class="heading">
        <h2>Welcome back</h2>
        <p>Sign in to access your library dashboard</p>
    </div>

    <!-- Error message -->
    <div th:if="${param.error}" class="alert" id="errorAlert">
        <span>⚠️ Invalid username or password. Please try again.</span>
        <button class="close-alert-btn" onclick="document.getElementById('errorAlert').style.display='none'">&times;</button>
    </div>

    <!-- Logout message -->
    <div th:if="${param.logout}" class="alert alert-success" id="logoutAlert">
        <span>✅ You've been logged out successfully.</span>
        <button class="close-alert-btn" onclick="document.getElementById('logoutAlert').style.display='none'">&times;</button>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <div class="input-wrap">
                <span class="input-icon">👤</span>
                <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required/>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrap">
                <span class="input-icon">🔑</span>
                <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required/>
            </div>
        </div>

        <button type="submit" class="btn">Sign In →</button>
    </form>

    <div class="divider">or</div>

    <p class="footer-text">
        Don't have an account? <a th:href="@{/signup}">Create one free →</a>
    </p>
</div>

<script>
    // Theme toggle functionality
    const toggleBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const themeText = document.getElementById('theme-text');
    const currentTheme = localStorage.getItem('theme');

    if (currentTheme === 'dark') {
        document.body.classList.add('dark-mode');
        themeIcon.textContent = '☀️';
        themeText.textContent = 'Light Mode';
    }

    toggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        let theme = 'light';
        if (document.body.classList.contains('dark-mode')) {
            theme = 'dark';
            themeIcon.textContent = '☀️';
            themeText.textContent = 'Light Mode';
        } else {
            themeIcon.textContent = '🌙';
            themeText.textContent = 'Dark Mode';
        }
        localStorage.setItem('theme', theme);
    });

    // Clean URL query parameters to avoid displaying error alert when refreshing/entering clean URL
    if (window.location.search.includes('error') || window.location.search.includes('logout') || window.location.search.includes('registered')) {
        setTimeout(() => {
            const url = new URL(window.location);
            url.search = '';
            window.history.replaceState({}, document.title, url.toString());
        }, 500);
    }
</script>
</body>
</html>
