<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign Up – OPAC Library System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-color: #f5f5f5;
            --text-color: #333333;
            --card-bg: #ffffff;
            --card-border: #e0e0e0;
            --card-shadow: rgba(0, 0, 0, 0.05);
            --heading-color: #2c3e50;
            --text-secondary: #7f8c8d;
            --input-bg: #ffffff;
            --input-border: #d1d5db;
            --input-text: #111827;
            --divider-color: #e5e7eb;
            --perk-bg: #f3f4f6;
            --perk-border: #e5e7eb;
            --perk-text: #4b5563;
        }

        body.dark-mode {
            --bg-color: #0a0a1a;
            --text-color: #f3f4f6;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.1);
            --card-shadow: rgba(0, 0, 0, 0.5);
            --heading-color: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.45);
            --input-bg: rgba(255, 255, 255, 0.06);
            --input-border: rgba(255, 255, 255, 0.1);
            --input-text: #ffffff;
            --divider-color: rgba(255, 255, 255, 0.1);
            --perk-bg: rgba(255, 255, 255, 0.05);
            --perk-border: rgba(255, 255, 255, 0.08);
            --perk-text: rgba(255, 255, 255, 0.5);
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-color);
            background-image: linear-gradient(135deg, var(--bg-color), var(--bg-color));
            color: var(--text-color);
            position: relative;
            transition: background-color 0.3s, color 0.3s;
            padding: 24px;
        }

        body.dark-mode {
            background-image: linear-gradient(135deg, #0a0a1a, #1a0a2e, #0d1b2a);
        }

        /* Top Theme Toggle Switch */
        .theme-toggle-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            font-size: 18px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 20px;
            box-shadow: 0 4px 6px var(--card-shadow);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        .theme-toggle-btn:hover {
            transform: scale(1.05);
            background: var(--divider-color);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 40px 36px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 25px var(--card-shadow);
            animation: fadeIn 0.4s ease-out;
            position: relative;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .logo-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            color: #fff;
        }
        .logo-text h1 { font-size: 18px; font-weight: 700; color: var(--heading-color); }
        .logo-text p  { font-size: 11px; color: var(--text-secondary); }

        .heading { margin-bottom: 24px; }
        .heading h2 { font-size: 22px; font-weight: 700; color: var(--heading-color); }
        .heading p  { font-size: 13.5px; color: var(--text-secondary); margin-top: 4px; }

        .alert {
            background: #fdf2f2;
            border: 1px solid #fbd5d5;
            border-radius: 8px;
            padding: 12px 14px;
            color: #c81e1e;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .alert-success {
            background: #edfdfd;
            border-color: #c5f2f2;
            color: #0369a1;
        }
        .close-alert-btn {
            background: transparent;
            border: none;
            color: inherit;
            font-size: 18px;
            cursor: pointer;
            font-weight: 700;
            line-height: 1;
            padding: 0 4px;
        }

        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; color: var(--text-color); margin-bottom: 6px; opacity: 0.85; }

        .input-wrap { position: relative; }
        .input-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            font-size: 15px; opacity: 0.5; pointer-events: none;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            padding: 12px 14px 12px 38px;
            color: var(--input-text);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.15s;
        }
        input::placeholder { color: var(--text-secondary); opacity: 0.6; }
        input:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
        }

        .password-strength {
            margin-top: 6px;
            display: flex; gap: 4px;
        }
        .strength-bar {
            flex: 1; height: 3px; border-radius: 99px;
            background: #e5e7eb;
            transition: background 0.3s;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
        }
        .terms input[type="checkbox"] {
            width: 16px; height: 16px;
            accent-color: #3498db;
            margin-top: 2px;
            cursor: pointer;
        }
        .terms label {
            font-size: 12.5px;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .terms label a { color: #3498db; text-decoration: none; }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            background-color: #3498db;
            color: #fff;
            transition: background-color 0.15s, transform 0.1s;
        }
        .btn:hover { background-color: #2980b9; }
        .btn:active { transform: translateY(1px); }

        .perks {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .perk {
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--perk-bg);
            border: 1px solid var(--perk-border);
            border-radius: 99px;
            padding: 4px 12px;
            font-size: 11px;
            color: var(--perk-text);
        }

        .footer-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 20px;
        }
        .footer-text a {
            color: #3498db;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.15s;
        }
        .footer-text a:hover { color: #2980b9; }
    </style>
</head>
<body>
<!-- Theme toggle button top right of page -->
<button id="theme-toggle" class="theme-toggle-btn">
    <span id="theme-icon">🌙</span> <span id="theme-text">Dark Mode</span>
</button>

<div class="card">
    <div class="logo">
        <div class="logo-icon">📚</div>
        <div class="logo-text">
            <h1>OPAC</h1>
            <p>Library Management System</p>
        </div>
    </div>

    <div class="heading">
        <h2>Create your account</h2>
        <p>Join thousands of readers managing their library</p>
    </div>

    <div class="perks">
        <div class="perk">✅ Free forever</div>
        <div class="perk">📖 Unlimited books</div>
        <div class="perk">🔒 Secure</div>
    </div>

    <!-- Error message -->
    <div th:if="${error}" class="alert" id="errorAlert">
        <span th:text="${error}">Registration failed. Please try again.</span>
        <button class="close-alert-btn" onclick="document.getElementById('errorAlert').style.display='none'">&times;</button>
    </div>

    <!-- Success message -->
    <div th:if="${success}" class="alert alert-success" id="successAlert">
        <span>🎉 Account created! <a th:href="@{/login}" style="color:#0369a1; font-weight:600; text-decoration: underline;">Click here to login →</a></span>
        <button class="close-alert-btn" onclick="document.getElementById('successAlert').style.display='none'">&times;</button>
    </div>

    <form th:action="@{/signup}" th:object="${user}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <div class="input-wrap">
                <span class="input-icon">👤</span>
                <input type="text" id="username" th:field="*{username}" placeholder="Choose a username" autocomplete="username" required/>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-wrap">
                <span class="input-icon">✉️</span>
                <input type="email" id="email" th:field="*{email}" placeholder="you@example.com" autocomplete="email" required/>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrap">
                <span class="input-icon">🔑</span>
                <input type="password" id="password" th:field="*{password}" placeholder="Min. 8 characters" autocomplete="new-password" required/>
            </div>
            <div class="password-strength" id="strengthBars">
                <div class="strength-bar" id="b1"></div>
                <div class="strength-bar" id="b2"></div>
                <div class="strength-bar" id="b3"></div>
                <div class="strength-bar" id="b4"></div>
            </div>
        </div>

        <div class="terms">
            <input type="checkbox" id="terms" required/>
            <label for="terms">
                I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
            </label>
        </div>

        <button type="submit" class="btn">Create Account →</button>
    </form>

    <p class="footer-text">
        Already have an account? <a th:href="@{/login}">Sign in →</a>
    </p>
</div>

<script>
    // Theme toggle functionality
    const toggleBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const themeText = document.getElementById('theme-text');
    const currentTheme = localStorage.getItem('theme');

    if (currentTheme === 'dark') {
        document.body.classList.add('dark-mode');
        themeIcon.textContent = '☀️';
        themeText.textContent = 'Light Mode';
    }

    toggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        let theme = 'light';
        if (document.body.classList.contains('dark-mode')) {
            theme = 'dark';
            themeIcon.textContent = '☀️';
            themeText.textContent = 'Light Mode';
        } else {
            themeIcon.textContent = '🌙';
            themeText.textContent = 'Dark Mode';
        }
        localStorage.setItem('theme', theme);
    });

    const pwd = document.getElementById('password');
    const bars = [document.getElementById('b1'), document.getElementById('b2'), document.getElementById('b3'), document.getElementById('b4')];
    const colors = ['#ef4444', '#f59e0b', '#10b981', '#3498db'];

    pwd.addEventListener('input', () => {
        const v = pwd.value;
        let score = 0;
        if (v.length >= 6) score++;
        if (v.length >= 10) score++;
        if (/[A-Z]/.test(v) && /[0-9]/.test(v)) score++;
        if (/[^A-Za-z0-9]/.test(v)) score++;

        bars.forEach((b, i) => {
            b.style.background = i < score ? colors[score - 1] : '#e5e7eb';
        });
    });
</script>
</body>
</html>
