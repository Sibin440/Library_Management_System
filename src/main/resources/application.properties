# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/opac_db
spring.datasource.username=root
spring.datasource.password=MS@muthu130405
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none

# Flyway will manage schema migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=true

# Server Configuration - Change port to avoid conflict
server.port=8081

# Logging
logging.level.org.springframework=INFO
logging.level.com.example.opac=DEBUG