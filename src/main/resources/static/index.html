<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px 0;
            text-align: center;
        }
        
        header h1 {
            margin: 0;
        }
        
        .search-bar {
            display: flex;
            margin: 20px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .search-bar input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-right: none;
            border-radius: 4px 0 0 4px;
            font-size: 16px;
        }
        
        .search-bar button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 16px;
        }
        
        .search-bar button:hover {
            background-color: #2980b9;
        }
        
        .main-content {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        
        .book-form {
            flex: 1;
            background-color: white;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .book-form h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        
        .form-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        
        .btn-primary {
            background-color: #2ecc71;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #27ae60;
        }
        
        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #7f8c8d;
        }
        
        .books-list {
            flex: 2;
            background-color: white;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .books-list h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        
        .book-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .book-table th, .book-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .book-table th {
            background-color: #f2f2f2;
            font-weight: 600;
        }
        
        .book-table tr:hover {
            background-color: #f5f5f5;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        
        .btn-edit {
            background-color: #3498db;
            color: white;
        }
        
        .btn-edit:hover {
            background-color: #2980b9;
        }
        
        .btn-delete {
            background-color: #e74c3c;
            color: white;
        }
        
        .btn-delete:hover {
            background-color: #c0392b;
        }
        
        .notification {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            display: none;
        }
        
        .notification.success {
            background-color: #d5f5e3;
            color: #27ae60;
            border-left: 4px solid #27ae60;
        }
        
        .notification.error {
            background-color: #fadbd8;
            color: #e74c3c;
            border-left: 4px solid #e74c3c;
        }
        
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .book-form, .books-list {
                flex: none;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Library Management System</h1>
        </div>
    </header>
    
    <div class="container">
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search by title or author...">
            <button id="search-button">Search</button>
        </div>
        
        <div id="notification" class="notification"></div>
        
        <div class="main-content">
            <div class="book-form">
                <h2 id="form-title">Add New Book</h2>
                <form id="book-form">
                    <input type="hidden" id="book-id">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="author">Author</label>
                        <input type="text" id="author" name="author" required>
                    </div>
                    <div class="form-group">
                        <label for="isbn">ISBN</label>
                        <input type="text" id="isbn" name="isbn" required>
                    </div>
                    <div class="form-actions">
                        <button type="button" id="reset-button" class="btn btn-secondary">Reset</button>
                        <button type="submit" id="submit-button" class="btn btn-primary">Add Book</button>
                    </div>
                </form>
            </div>
            
            <div class="books-list">
                <h2>Books Collection</h2>
                <div class="loader" id="loader"></div>
                <table class="book-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Author</th>
                            <th>ISBN</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="books-table-body">
                        <!-- Book data will be inserted here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        // API Base URL - Using relative URL to avoid CORS issues
        const API_BASE_URL = '/api/books';
        
        // DOM Elements
        const bookForm = document.getElementById('book-form');
        const bookIdInput = document.getElementById('book-id');
        const titleInput = document.getElementById('title');
        const authorInput = document.getElementById('author');
        const isbnInput = document.getElementById('isbn');
        const resetButton = document.getElementById('reset-button');
        const submitButton = document.getElementById('submit-button');
        const formTitle = document.getElementById('form-title');
        const booksTableBody = document.getElementById('books-table-body');
        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        const notification = document.getElementById('notification');
        const loader = document.getElementById('loader');
        
        // Event Listeners
        document.addEventListener('DOMContentLoaded', loadBooks);
        bookForm.addEventListener('submit', handleFormSubmit);
        resetButton.addEventListener('click', resetForm);
        searchButton.addEventListener('click', handleSearch);
        searchInput.addEventListener('keyup', function(event) {
            if (event.key === 'Enter') {
                handleSearch();
            }
        });
        
        // Functions
        
        // Show loader
        function showLoader() {
            loader.style.display = 'block';
        }
        
        // Hide loader
        function hideLoader() {
            loader.style.display = 'none';
        }
        
        // Show notification
        function showNotification(message, type) {
            notification.textContent = message;
            notification.className = 'notification ' + type;
            notification.style.display = 'block';
            
            // Auto hide after 3 seconds
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
        
        // Load all books
        async function loadBooks() {
            try {
                showLoader();
                const response = await fetch(API_BASE_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const books = await response.json();
                displayBooks(books);
            } catch (error) {
                showNotification('Failed to load books: ' + error.message, 'error');
                console.error('Error loading books:', error);
            } finally {
                hideLoader();
            }
        }
        
        // Display books in the table
        function displayBooks(books) {
            booksTableBody.innerHTML = '';
            
            if (books.length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td colspan="4" style="text-align: center;">No books found</td>
                `;
                booksTableBody.appendChild(row);
                return;
            }
            
            books.forEach(book => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${book.title}</td>
                    <td>${book.author}</td>
                    <td>${book.isbn}</td>
                    <td class="action-buttons">
                        <button class="btn btn-edit" data-id="${book.id}">Edit</button>
                        <button class="btn btn-delete" data-id="${book.id}">Delete</button>
                    </td>
                `;
                booksTableBody.appendChild(row);
                
                // Add event listeners to buttons
                row.querySelector('.btn-edit').addEventListener('click', () => editBook(book));
                row.querySelector('.btn-delete').addEventListener('click', () => deleteBook(book.id));
            });
        }
        
        // Handle form submission (Add/Update book)
        async function handleFormSubmit(event) {
            event.preventDefault();
            
            const bookData = {
                title: titleInput.value,
                author: authorInput.value,
                isbn: isbnInput.value
            };
            
            const bookId = bookIdInput.value;
            let url = API_BASE_URL;
            let method = 'POST';
            
            // If bookId exists, it's an update operation
            if (bookId) {
                url = `${API_BASE_URL}/${bookId}`;
                method = 'PUT';
                bookData.id = bookId;
            }
            
            try {
                showLoader();
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bookData)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                
                const savedBook = await response.json();
                showNotification(
                    `Book "${savedBook.title}" has been ${bookId ? 'updated' : 'added'} successfully!`, 
                    'success'
                );
                
                resetForm();
                loadBooks();
            } catch (error) {
                showNotification(`Failed to ${bookId ? 'update' : 'add'} book: ` + error.message, 'error');
                console.error(`Error ${bookId ? 'updating' : 'adding'} book:`, error);
            } finally {
                hideLoader();
            }
        }
        
        // Edit book - populate form with book data
        function editBook(book) {
            bookIdInput.value = book.id;
            titleInput.value = book.title;
            authorInput.value = book.author;
            isbnInput.value = book.isbn;
            formTitle.textContent = 'Edit Book';
            submitButton.textContent = 'Update Book';
            
            // Scroll to form
            bookForm.scrollIntoView({ behavior: 'smooth' });
        }
        
        // Delete book
        async function deleteBook(id) {
            if (!confirm('Are you sure you want to delete this book?')) {
                return;
            }
            
            try {
                showLoader();
                const response = await fetch(`${API_BASE_URL}/${id}`, {
                    method: 'DELETE'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                
                showNotification('Book has been deleted successfully!', 'success');
                loadBooks();
            } catch (error) {
                showNotification('Failed to delete book: ' + error.message, 'error');
                console.error('Error deleting book:', error);
            } finally {
                hideLoader();
            }
        }
        
        // Handle search
        async function handleSearch() {
            const query = searchInput.value.trim();
            if (!query) {
                loadBooks();
                return;
            }
            
            try {
                showLoader();
                const response = await fetch(`${API_BASE_URL}/search?query=${encodeURIComponent(query)}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                
                const books = await response.json();
                displayBooks(books);
            } catch (error) {
                showNotification('Search failed: ' + error.message, 'error');
                console.error('Error searching books:', error);
            } finally {
                hideLoader();
            }
        }
        
        // Reset form
        function resetForm() {
            bookForm.reset();
            bookIdInput.value = '';
            formTitle.textContent = 'Add New Book';
            submitButton.textContent = 'Add Book';
        }
    </script>
</body>
</html>
